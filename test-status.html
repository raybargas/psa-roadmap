<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Column Test</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background: #f5f5f5;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 2px solid #4a90e2;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>Status Column Debug Test</h1>
    
    <div class="test-section">
        <h2>Test 1: Direct Function Call</h2>
        <div id="test1"></div>
    </div>

    <div class="test-section">
        <h2>Test 2: Sample Table</h2>
        <table>
            <thead>
                <tr>
                    <th>Feature</th>
                    <th>Status Column</th>
                    <th>Raw Status Value</th>
                </tr>
            </thead>
            <tbody id="test2"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
    <script>
        // Test 1: Direct function call
        if (typeof getStatusBadge === "function") {
            document.getElementById("test1").innerHTML = `
                <p>Direct call result: ${getStatusBadge("Available")}</p>
                <p>With undefined: ${getStatusBadge(undefined)}</p>
                <p>With null: ${getStatusBadge(null)}</p>
                <p>With empty string: ${getStatusBadge("")}</p>
            `;
        } else {
            document.getElementById("test1").innerHTML = "<p style=\"color: red;\">ERROR: getStatusBadge function not found!</p>";
        }

        // Test 2: Sample table with different statuses
        const testFeatures = [
            { name: "Feature 1", status: "Available" },
            { name: "Feature 2", status: "Coming GA" },
            { name: "Feature 3", status: "On Roadmap" },
            { name: "Feature 4", status: undefined },
            { name: "Feature 5", status: null },
            { name: "Feature 6", status: "" }
        ];

        const tbody = document.getElementById("test2");
        if (typeof getStatusBadge === "function") {
            testFeatures.forEach(feature => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${feature.name}</td>
                    <td>${getStatusBadge(feature.status || "Available")}</td>
                    <td>${feature.status || "undefined/null/empty"}</td>
                `;
                tbody.appendChild(row);
            });
        } else {
            tbody.innerHTML = "<tr><td colspan=\"3\" style=\"color: red;\">ERROR: getStatusBadge function not found!</td></tr>";
        }

        // Log to console
        console.log("getStatusBadge function exists:", typeof getStatusBadge === "function");
        console.log("Test completed. Check the rendered badges above.");
    </script>
</body>
</html>
